name: shl-sync

on:
  schedule:
    - cron: '0 5 * * *'   # daily, 05:00 UTC (early morning in Sweden, after the previous night's games)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shl-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Fetch SHL + HockeyAllsvenskan data
        run: python3 fetch_shl.py

      - name: Validate JSON
        run: |
          python3 -c "
          import json
          d = json.load(open('shl-briefen-data.json'))
          leagues = d.get('leagues', {})
          assert leagues, 'no leagues in payload'
          for key, league in leagues.items():
              print(key, '-', league.get('label'), ':', len(league.get('standings', [])), 'teams,',
                    len(league.get('recentResults', [])), 'recent results,',
                    len(league.get('upcoming', [])), 'upcoming')
          "

      - name: Commit and push
        run: |
          git config user.name "shl-briefen-bot"
          git config user.email "shl-briefen-bot@users.noreply.github.com"
          git add shl-briefen-data.json
          git commit -m "Update SHL + HockeyAllsvenskan data" || exit 0
          git push
